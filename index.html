<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webhook-Test: Campus-Navigation</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#d9dde3; --text:#1c2230; --muted:#667085; --accent:#1f6feb; --ok:#1a7f37; --warn:#b54708; --err:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:960px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:0 0 4px; }
  input[type=text], input[type=number], select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
  .row { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); margin-bottom:12px; }
  .row.one { grid-template-columns:1fr; }
  button { font:inherit; padding:8px 14px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.6; cursor:wait; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .chips button { font-size:13px; padding:4px 10px; }
  details { margin-top:8px; }
  summary { cursor:pointer; color:var(--muted); font-size:13px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:13px; font-weight:600; color:#fff; }
  .badge.ok { background:var(--ok); } .badge.warn { background:var(--warn); } .badge.err { background:var(--err); }
  .meta { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:10px; color:var(--muted); font-size:13px; }
  #antwort { white-space:pre-wrap; margin:0 0 12px; }
  .hint { background:#fff7e6; border:1px solid #f5d28a; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:10px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .tabs button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  svg { width:100%; height:auto; max-height:520px; background:#fbfcfd; border:1px solid var(--line); border-radius:8px; }
  pre.raw { background:#0f172a; color:#e2e8f0; padding:12px; border-radius:8px; overflow:auto; max-height:360px; font-size:12px; margin:0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Webhook-Test: Campus-Navigation</h1>
  <p class="sub">Schickt eine Frage an den n8n-Webhook und zeigt Antwort, Status, Laufzeit und die Route.</p>

  <section class="card">
    <div class="row one">
      <div>
        <label for="url">Webhook-URL</label>
        <input type="text" id="url" autocomplete="off">
      </div>
    </div>
    <div class="row one">
      <div>
        <label for="frage">Frage</label>
        <input type="text" id="frage" placeholder="Wo ist HS1?" autocomplete="off">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="startId">Start-ID (optional, z. B. 03.02.K4)</label>
        <input type="text" id="startId" autocomplete="off">
      </div>
      <div>
        <label for="sessionId">Session-ID</label>
        <input type="text" id="sessionId" autocomplete="off">
      </div>
    </div>
    <details>
      <summary>Position statt Start-ID senden (x, y, Etage, Haus)</summary>
      <div class="row" style="margin-top:10px">
        <div><label for="posX">x</label><input type="number" id="posX" step="any"></div>
        <div><label for="posY">y</label><input type="number" id="posY" step="any"></div>
        <div><label for="posEtage">Etage</label><input type="number" id="posEtage" step="1"></div>
        <div><label for="posHaus">Haus (z. B. 03)</label><input type="text" id="posHaus" autocomplete="off"></div>
      </div>
    </details>
    <div style="margin-top:12px; display:flex; gap:8px; align-items:center;">
      <button class="primary" id="send">Senden</button>
      <button id="newSession">Neue Session</button>
      <span id="busy" hidden style="color:var(--muted)">Warte auf Antwort ...</span>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="card" id="result" hidden>
    <div class="meta">
      <span id="statusBadge" class="badge"></span>
      <span id="time"></span>
      <span id="ziel"></span>
      <span id="dist"></span>
    </div>
    <div id="hint" class="hint" hidden></div>
    <pre id="antwort"></pre>
    <div id="mapBox" hidden>
      <div class="tabs" id="tabs"></div>
      <svg id="map" viewBox="0 0 800 500" role="img" aria-label="Routenverlauf"></svg>
    </div>
    <details style="margin-top:12px">
      <summary>Rohantwort (JSON)</summary>
      <pre class="raw" id="raw"></pre>
    </details>
  </section>
</main>

<script>
// ---- Einstellungen: hier fest anbinden --------------------------------------
const CONFIG = {
  // Test-URL: nur nach "Listen for test event" im Editor erreichbar.
  // Production-URL (/webhook/...): Workflow muss aktiv (published) sein.
  WEBHOOK_URL: 'http://localhost:5678/webhook-test/campus-navigation',
  TIMEOUT_MS: 30000,
  BEISPIELE: ['Wo ist HS1?', 'Wo ist der Raum von Professor Brehm?', 'Wo ist die nächste Toilette?', 'Wie komme ich zum IuK-Labor?', 'Wo ist Prof. Herbst?', 'Wo ist Raum 99.99.99?']
};
// -----------------------------------------------------------------------------

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
};

function neueSession() { return 'test-' + Math.random().toString(36).slice(2, 10); }

$('url').value = store.get('wh_url') || CONFIG.WEBHOOK_URL;
$('sessionId').value = store.get('wh_session') || neueSession();
$('newSession').addEventListener('click', () => { $('sessionId').value = neueSession(); store.set('wh_session', $('sessionId').value); });
$('url').addEventListener('change', () => store.set('wh_url', $('url').value.trim()));
$('sessionId').addEventListener('change', () => store.set('wh_session', $('sessionId').value.trim()));

for (const text of CONFIG.BEISPIELE) {
  const b = document.createElement('button');
  b.textContent = text;
  b.addEventListener('click', () => { $('frage').value = text; senden(); });
  $('chips').appendChild(b);
}
$('send').addEventListener('click', senden);
$('frage').addEventListener('keydown', e => { if (e.key === 'Enter') senden(); });

function baueBody() {
  const body = { frage: $('frage').value.trim(), sessionId: $('sessionId').value.trim() || neueSession() };
  const start = $('startId').value.trim();
  if (start) body.start_id = start;
  const x = $('posX').value, y = $('posY').value, e = $('posEtage').value, h = $('posHaus').value.trim();
  if (x !== '' && y !== '' && e !== '') {
    body.x = Number(x); body.y = Number(y); body.etage = Number(e);
    if (h) body.haus = h;
  }
  return body;
}

async function senden() {
  const url = $('url').value.trim();
  const body = baueBody();
  if (!url) return zeigeFehler('Bitte eine Webhook-URL eintragen.');
  if (!body.frage) return zeigeFehler('Bitte eine Frage eingeben.');
  store.set('wh_url', url);
  $('send').disabled = true; $('busy').hidden = false;
  const t0 = performance.now();
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.TIMEOUT_MS);
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
    const text = await res.text();
    let json = null;
    try { json = JSON.parse(text); } catch (_) {}
    zeigeAntwort(res.status, json, text, performance.now() - t0, body);
  } catch (err) {
    const ms = performance.now() - t0;
    if (err.name === 'AbortError') {
      zeigeFehler('Keine Antwort nach ' + (CONFIG.TIMEOUT_MS / 1000) + ' s (Timeout). Läuft der Workflow, und steht bei der Test-URL "Listen for test event"?', ms);
    } else {
      zeigeFehler('Anfrage fehlgeschlagen: ' + err.message + '\n\nMögliche Ursachen:\n'
        + '- n8n läuft nicht oder die URL stimmt nicht.\n'
        + '- CORS: Im Webhook-Knoten unter Options > Allowed Origins muss die Herkunft dieser Seite stehen (z. B. http://localhost:8000 oder * zum Testen).\n'
        + '- Test-URL ohne vorheriges "Listen for test event" oder Workflow nicht aktiv (Production-URL).\n'
        + '- Diese Seite läuft über https, die URL ist aber http (Mixed Content).', ms);
    }
  } finally {
    clearTimeout(timer);
    $('send').disabled = false; $('busy').hidden = true;
  }
}

function zeigeFehler(msg, ms) {
  $('result').hidden = false;
  const b = $('statusBadge'); b.textContent = 'Fehler'; b.className = 'badge err';
  $('time').textContent = ms != null ? Math.round(ms) + ' ms' : '';
  $('ziel').textContent = ''; $('dist').textContent = '';
  $('hint').hidden = true;
  $('antwort').textContent = msg;
  $('mapBox').hidden = true;
  $('raw').textContent = '';
}

function zeigeAntwort(status, json, rawText, ms, gesendet) {
  $('result').hidden = false;
  const b = $('statusBadge');
  b.textContent = 'HTTP ' + status;
  b.className = 'badge ' + (status >= 500 ? 'err' : status >= 400 ? 'warn' : 'ok');
  $('time').textContent = Math.round(ms) + ' ms';
  const hint = $('hint'); hint.hidden = true;

  if (!json || typeof json !== 'object') {
    $('ziel').textContent = ''; $('dist').textContent = '';
    $('antwort').textContent = 'Die Antwort ist kein JSON:\n' + rawText.slice(0, 2000);
    $('mapBox').hidden = true;
    $('raw').textContent = rawText;
    return;
  }
  $('ziel').textContent = json.ziel && (json.ziel.name || json.ziel.id) ? 'Ziel: ' + (json.ziel.name || json.ziel.id) : '';
  $('dist').textContent = typeof json.gesamt_m === 'number' ? json.gesamt_m.toString().replace('.', ',') + ' m' : '';
  $('antwort').textContent = json.antwort || json.hinweis || json.text || '(kein Antworttext)';
  $('raw').textContent = JSON.stringify(json, null, 2);

  const route = Array.isArray(json.route) ? json.route : [];
  if (!('route' in json)) {
    hint.hidden = false;
    hint.textContent = 'Die Antwort enthält kein Feld "route". Im Workflow-Knoten "Antwort aufbereiten" muss route ergänzt sein (siehe Version v4).';
  } else if (status >= 400) {
    hint.hidden = false;
    hint.textContent = 'Fehlerstatus ' + status + ': Die Website muss den JSON-Body lesen (status/antwort) und darf keine Route zeichnen.';
  }
  if (status < 400 && route.length > 1) zeichneRoute(route); else $('mapBox').hidden = true;
}

// ---- Routenansicht: Punkte nach Etage gruppiert -------------------------------
function zeichneRoute(route) {
  const gruppen = new Map();
  route.forEach((p, i) => {
    if (typeof p.x !== 'number' || typeof p.y !== 'number') return;
    const key = String(p.etage);
    if (!gruppen.has(key)) gruppen.set(key, []);
    gruppen.get(key).push({ ...p, i });
  });
  if (!gruppen.size) { $('mapBox').hidden = true; return; }
  $('mapBox').hidden = false;
  const tabs = $('tabs'); tabs.textContent = '';
  const keys = [...gruppen.keys()];
  const letzterIdx = route.length - 1;
  const zeige = key => {
    [...tabs.children].forEach(c => c.classList.toggle('active', c.dataset.key === key));
    zeichneEtage(gruppen.get(key), letzterIdx);
  };
  keys.forEach(key => {
    const b = document.createElement('button');
    b.dataset.key = key;
    const haeuser = [...new Set(gruppen.get(key).map(p => p.haus).filter(Boolean))];
    b.textContent = 'Etage ' + key + (haeuser.length ? ' (Haus ' + haeuser.join('/') + ')' : '');
    b.addEventListener('click', () => zeige(key));
    tabs.appendChild(b);
  });
  zeige(keys[0]);
}

function zeichneEtage(pts, letzterIdx) {
  const svg = $('map'); const NS = 'http://www.w3.org/2000/svg';
  svg.textContent = '';
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 12, W = 800, H = 500;
  const spanX = Math.max(maxX - minX, 1), spanY = Math.max(maxY - minY, 1);
  const s = Math.min((W - 2 * pad) / spanX, (H - 2 * pad) / spanY);
  const ox = (W - spanX * s) / 2, oy = (H - spanY * s) / 2;
  const X = x => ox + (x - minX) * s, Y = y => oy + (y - minY) * s; // y nach unten wie im Bauplan
  const el = (name, attrs) => { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  svg.appendChild(el('polyline', { points: pts.map(p => X(p.x) + ',' + Y(p.y)).join(' '), fill: 'none', stroke: '#1f6feb', 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  pts.forEach(p => {
    const start = p.i === 0, ziel = p.i === letzterIdx;
    const c = el('circle', { cx: X(p.x), cy: Y(p.y), r: start || ziel ? 8 : 3.5, fill: start ? '#1a7f37' : ziel ? '#b42318' : '#fff', stroke: '#1f6feb', 'stroke-width': 2 });
    const t = document.createElementNS(NS, 'title'); t.textContent = (p.id || '') + '  (' + p.x + ' / ' + p.y + ')';
    c.appendChild(t); svg.appendChild(c);
  });
}
</script>
</body>
</html>
